<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muskelaufbau Tracker</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#101827"><style>
:root{font-family:system-ui,Arial;background:#101827;color:#eef3fa}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:18px 14px 60px}h1{font-size:25px;margin:8px 0}h2{font-size:19px}p,small{color:#b4c0d1}.panel{background:#1b283a;border:1px solid #33445c;border-radius:15px;padding:15px;margin:12px 0}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{flex:1}button,input,select{font:inherit;border-radius:9px;padding:10px;border:1px solid #4b607c;background:#26374e;color:white}button{cursor:pointer}button.primary{background:#4d8af0;border:0;font-weight:700}button:disabled{opacity:.45}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.sets{display:grid;grid-template-columns:48px 1fr 1fr 48px;gap:7px;align-items:center;margin-top:9px}.sets input{width:100%;min-width:0}.sets input[type=checkbox]{width:23px;height:23px;accent-color:#58cb94}.muted{color:#b4c0d1;font-size:13px}.active{outline:2px solid #83b4ff}.danger{color:#ffb0b0}.stat{font-size:24px;font-weight:750}.hidden{display:none}label{display:block;margin:8px 0}input[type=date]{max-width:190px}#history .panel{margin:8px 0} .pill{background:#344963;padding:5px 9px;border-radius:20px;font-size:12px}button:focus-visible,input:focus-visible{outline:2px solid #8bbaff}
</style></head><body><main><h1>Muskelaufbau-Tracker</h1><p>Klinik · Oberkörper & Bauch · bis Mitte Dezember 2026</p><nav class="tabs"><button id="tabTrain" class="active" onclick="tab('train')">Training</button><button id="tabHistory" onclick="tab('history')">Historie</button><button id="tabStats" onclick="tab('stats')">Fortschritt</button></nav>
<section id="train"><div class="panel"><p class="muted">Krafttraining vom Klinikteam freigegeben.</p><input type="checkbox" id="approval" checked class="hidden"><div class="row"><label>Datum <input type="date" id="date"></label><label>Plan <select id="plan"><option value="A">A · Brust/Trizeps/Bauch</option><option value="B">B · Rücken/Bizeps</option><option value="R">Regeneration</option></select></label></div><label>Sätze je Übung <select id="count"><option value="3">3</option><option value="2">2</option></select></label><p id="counter"></p></div><div id="exercises"></div><div class="panel"><h2>Zusatzübung</h2><div class="row"><select id="extraSelect"><option>Liegestütze</option><option>Reverse Crunches</option><option>Kurzhantel-Seitheben</option><option value="custom">Eigene Übung</option></select><button onclick="addExtra()">+ Hinzufügen</button></div><label id="customLabel" class="hidden">Übungsname <input id="customName" placeholder="z. B. Plank"></label><div id="extras"></div></div><div class="panel"><label>Notizen <input id="notes" style="width:100%" placeholder="Tagesform, Steigerungen …"></label><button class="primary" style="width:100%" onclick="saveWorkout()">Training speichern</button><p class="muted">Speicherung lokal in diesem Browser auf diesem Gerät. Für eine Sicherung regelmäßig JSON exportieren.</p></div></section>
<section id="history" class="hidden"><h2>Trainingshistorie</h2><div id="historyList"></div><button onclick="exportData()">Historie als JSON sichern</button> <label>Gesicherte JSON importieren <input type="file" accept=".json,application/json" id="importFile"></label></section>
<section id="stats" class="hidden"><h2>Fortschritt</h2><div id="statistics"></div><button onclick="exportData()">Daten exportieren</button></section>
</main><script>
const base={A:[['Kurzhantel-Bankdrücken',12.5,12,'kg je Hantel'],['Butterfly Brust',40,12,'kg'],['Kurzhantel-Seitheben',3,12,'kg je Hantel · Test 2–4 kg'],['Trizepsdrücken Kabelzug',40,12,'kg'],['Reverse Crunches',0,15,'Körpergewicht · 12–15 Wdh.']],B:[['Latzug zur Brust',50,12,'kg'],['Rudermaschine',45,12,'kg'],['Bizepscurls',12.5,12,'kg je Hantel · pro Arm'],['Shrugs Multipresse',40,12,'kg Zusatzgewicht · Stange unbekannt']]};
const storeKey='klinik-muskeltracker-v1';let saved;try{saved=JSON.parse(localStorage.getItem(storeKey)||'[]');if(!Array.isArray(saved))saved=[]}catch{saved=[]}
let draft={};let extras=[];const $=id=>document.getElementById(id);$('date').value=new Date().toLocaleDateString('en-CA');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tab(t){for(const k of ['train','history','stats']){$(k).classList.toggle('hidden',k!==t);$('tab'+k[0].toUpperCase()+k.slice(1)).classList.toggle('active',k===t)}if(t==='history')renderHistory();if(t==='stats')renderStats()}
function makeSet(ex,i,extra=false){const id=(extra?'extra-':'base-')+ex.id+'-'+i;const v=draft[id]||{kg:ex.kg,reps:ex.reps,done:false};return `<div class="sets"><span>${i+1}.</span><input aria-label="Gewicht Satz ${i+1}" type="number" min="0" step="0.5" value="${esc(v.kg)}" oninput="edit('${id}','kg',this.value)"><input aria-label="Wiederholungen Satz ${i+1}" type="number" min="0" step="1" value="${esc(v.reps)}" oninput="edit('${id}','reps',this.value)"><input aria-label="Satz ${i+1} erledigt" type="checkbox" ${v.done?'checked':''} onchange="edit('${id}','done',this.checked)"></div>`}
function exerciseCard(ex,extra=false){return `<div class="panel"><div class="row"><strong>${esc(ex.name)}</strong>${extra?`<button onclick="removeExtra(${ex.id})">Entfernen</button>`:''}</div><div class="muted">${esc(ex.unit)}</div><div class="sets muted"><span>Satz</span><span>kg</span><span>Wdh.</span><span>Fertig</span></div>${Array.from({length:extra?ex.count:+$('count').value},(_,i)=>makeSet(ex,i,extra)).join('')}</div>`}
function currentExercises(){return (base[$('plan').value]||[]).map((a,i)=>({id:i,name:a[0],kg:a[1],reps:a[2],unit:a[3]}))}
function render(){const arr=currentExercises();$('exercises').innerHTML=arr.map(e=>exerciseCard(e)).join('')||'<div class="panel">Regenerationstag – kein Krafttraining.</div>';$('extras').innerHTML=extras.map(e=>exerciseCard(e,true)).join('');counter()}
function edit(id,field,val){draft[id]??={};draft[id][field]=field==='done'?val:val;counter()}
function counter(){let total=0,done=0;for(const [extra,exs] of [[false,currentExercises().map(e=>({...e,count:+$('count').value}))],[true,extras]])for(const ex of exs){for(let i=0;i<ex.count;i++){total++;if(draft[(extra?'extra-':'base-')+ex.id+'-'+i]?.done)done++}}$('counter').textContent=`${done} von ${total} Sätzen abgehakt`}
function addExtra(){let name=$('extraSelect').value;if(name==='custom'){name=$('customName').value.trim();if(!name){$('customLabel').classList.remove('hidden');$('customName').focus();return}}const id=Date.now()+Math.floor(Math.random()*1000);extras.push({id,name,kg:0,reps:name==='Liegestütze'?20:12,unit:'Zusatzübung',count:1});render()}
function removeExtra(id){extras=extras.filter(e=>e.id!==id);render()}
function saveWorkout(){if(!$('approval').checked){alert('Bitte erst die Freigabe des Klinikteams bestätigen.');return}const plan=$('plan').value;let entries=[];for(const [extra,exs] of [[false,currentExercises().map(e=>({...e,count:+$('count').value}))],[true,extras]])for(const e of exs)for(let i=0;i<e.count;i++){const v=draft[(extra?'extra-':'base-')+e.id+'-'+i];if(v?.done){const kg=Number(v.kg??e.kg),reps=Number(v.reps??e.reps);if(!Number.isFinite(kg)||kg<0||!Number.isInteger(reps)||reps<0){alert('Bitte Gewichte und Wiederholungen prüfen.');return}entries.push({name:e.name,set:i+1,kg,reps,unit:e.unit,extra})}}if(plan!=='R'&&!entries.length){alert('Bitte mindestens einen Satz abhaken.');return}const record={id:Date.now(),date:$('date').value,plan,entries,notes:$('notes').value};saved.push(record);try{localStorage.setItem(storeKey,JSON.stringify(saved))}catch{saved.pop();alert('Speichern fehlgeschlagen. Bitte Browser-Speicher prüfen.');return}draft={};extras=[];$('notes').value='';render();alert('Training lokal gespeichert.');tab('history')}
function renderHistory(){const items=[...saved].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);$('historyList').innerHTML=items.length?items.map(r=>`<div class="panel"><div class="row"><strong>${esc(r.date)} · ${r.plan==='R'?'Regeneration':'Training '+esc(r.plan)}</strong><span class="pill">${r.entries.length} Sätze</span></div>${r.entries.map(e=>`<div class="muted">${esc(e.name)} · Satz ${e.set}: ${e.kg} kg × ${e.reps}${e.extra?' · Zusatz':''}</div>`).join('')}<p>${esc(r.notes||'')}</p><button onclick="deleteRecord(${r.id})">Eintrag löschen</button></div>`).join(''):'<p>Noch keine Trainingseinheiten gespeichert.</p>'}
function deleteRecord(id){if(!confirm('Diesen Eintrag wirklich löschen?'))return;saved=saved.filter(r=>r.id!==id);localStorage.setItem(storeKey,JSON.stringify(saved));renderHistory()}
function renderStats(){const all=saved.flatMap(r=>r.entries);const days=new Set(saved.map(r=>r.date));const best={};for(const e of all)if(!best[e.name]||e.kg>best[e.name].kg)best[e.name]=e;$('statistics').innerHTML=`<div class="panel"><div class="stat">${saved.length}</div>gespeicherte Einheiten</div><div class="panel"><div class="stat">${days.size}</div>Trainingstage / protokollierte Tage</div><div class="panel"><div class="stat">${all.length}</div>abgeschlossene Sätze</div><h2>Höchste erfasste Gewichte</h2>${Object.values(best).map(e=>`<div class="panel">${esc(e.name)}: <strong>${e.kg} kg</strong> × ${e.reps}</div>`).join('')||'<p>Noch keine Werte.</p>'}`}
function exportData(){const blob=new Blob([JSON.stringify({app:'klinik-muskeltracker-v1',records:saved},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='trainingshistorie-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('importFile').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!Array.isArray(obj.records)||obj.app!=='klinik-muskeltracker-v1')throw Error();if(!confirm('Gespeicherte Einträge importieren und mit vorhandenen Einträgen zusammenführen?'))return;const byId=new Map(saved.map(r=>[r.id,r]));for(const r of obj.records)if(r&&typeof r.id==='number'&&typeof r.date==='string'&&Array.isArray(r.entries))byId.set(r.id,r);saved=[...byId.values()];localStorage.setItem(storeKey,JSON.stringify(saved));renderHistory();alert('Import erfolgreich')}catch{alert('Datei konnte nicht importiert werden.')}ev.target.value=''}
$('plan').onchange=()=>{draft={};extras=[];render()};$('count').onchange=()=>{draft={};render()};$('extraSelect').onchange=()=>{$('customLabel').classList.toggle('hidden',$('extraSelect').value!=='custom')};render();
</script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
